# PrintBridge configuration.
# Copy to config.yaml. Most settings can also be changed from the web UI.

# Network printer/scanner that speaks eSCL (scan) and IPP (print).
printer:
  # Hostname or IP of the device on your LAN, e.g. the HP OfficeJet Pro 9010.
  host: "192.168.0.98"
  # eSCL (AirScan) base path. Standard for most AirScan devices.
  escl_path: "/eSCL"

# Where the web UI listens. Bind to 0.0.0.0 to reach it from other machines.
web:
  host: "0.0.0.0"
  port: 8080

# Cloud -> Print: PrintBridge watches a cloud folder and prints new files.
# The on/off switch is toggled in the web UI; this is only the default and the
# polling interval.
autoprint:
  enabled: false
  interval_seconds: 60

# Walk-up scanning: the printer scans to an SMB folder on this machine and
# PrintBridge uploads each new file to the chosen cloud service. On/off is
# toggled in the web UI.
scan_inbox:
  enabled: false
  dir: ""                   # e.g. /home/pi/scan-inbox (the Samba share path)
  service: "protondrive"    # cloud provider key to upload into
  min_age_seconds: 10       # ignore files still being written

# OCR + auto-rename: run each scan through ocrmypdf before upload. Makes the PDF
# searchable and derives a filename (date + title) from the text. Needs the
# ocrmypdf + tesseract packages installed; falls back to the original on failure.
ocr:
  enabled: false
  language: "deu+eng"       # Tesseract language packs (apt: tesseract-ocr-deu ...)

# Local SQLite database for the activity log. Relative paths are resolved
# against the data directory (default: ~/.local/share/printbridge).
database: "printbridge.db"

# Cloud services. Secrets entered via the web UI are stored in the data
# directory, NOT here. This file only holds non-secret, declarative settings.
services:
  webdav:
    enabled: false
    # Server URL, username and app-password are entered in the web UI
    # (works with Nextcloud, ownCloud, many NAS, mailbox.org, ...).
    upload_folder: "/PrintBridge"
    print_folder: "/PrintBridge/ToPrint"
  protondrive:
    enabled: false
    # Uses Proton's official `proton-drive` CLI as a subprocess. Install it and
    # run `proton-drive auth login` once; see README. Experimental.
    binary: "proton-drive"           # path or name on PATH
    upload_folder: "/my-files/PrintBridge"
    print_folder: "/my-files/PrintBridge/ToPrint"
