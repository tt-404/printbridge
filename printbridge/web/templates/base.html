<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}PrintBridge{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  {% set _p = request.url.path %}
  <header>
    <a class="brand" href="/">PrintBridge</a>
    <nav>
      <a href="/" class="{{ 'active' if _p == '/' }}">Übersicht</a>
      <a href="/services" class="{{ 'active' if _p.startswith('/services') }}">Dienste</a>
      <a href="/activity" class="{{ 'active' if _p.startswith('/activity') }}">Protokoll</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer>PrintBridge v{{ version }}</footer>
</body>
</html>
