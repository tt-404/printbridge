[project]
name = "printbridge"
version = "0.1.0"
description = "Web-first cloud bridge for network printers/scanners (eSCL + IPP). Runs on a Raspberry Pi next to the printer and connects it to cloud services the firmware does not offer."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "jinja2>=3.1",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
printbridge = "printbridge.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["printbridge*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
